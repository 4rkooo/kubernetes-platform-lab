apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: platform-lab
data:
  default.conf: |
    server {
      listen 80;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
  
      location /api/ {
        proxy_pass http://backend-service:8080/; 
        #tells nginx to forward requests to this backend service, port 8080
      }
    }
    
  #y do i need this? nginx doesn't have the configuration for the backend in 
  #it's container, so instead of rebuilding i can simply store it seperately 
  #..inside of a ConfigMap
